name: Windows smoke test

# 手動執行：在 Windows runner 上跑 IslandBar --shot，把設定畫面與動態島截圖推到 ci-smoke 分支（只用來檢查畫面）
on:
  workflow_dispatch:
    inputs:
      assistant:
        description: '也跑語音助理自我測試（會下載模型，比較久）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/IslandBar/IslandBar.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish

      - name: Screenshots
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA 'IslandBar'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $settings = @{
            ShelfFiles = @('C:\Windows\notepad.exe', 'C:\Windows\win.ini', 'C:\Windows\System32\drivers\etc')
            AutoUpdate = $false
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path $dir 'settings.json'), $settings, [Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force shots | Out-Null
          $shots = (Resolve-Path shots).Path
          $p = Start-Process -FilePath publish\IslandBar.exe -ArgumentList '--shot', $shots -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process $p -Force; 'timeout' | Out-File shots\timeout.txt }
          Copy-Item (Join-Path $dir 'log.txt') shots\log.txt -ErrorAction SilentlyContinue
          Get-ChildItem shots | Format-Table Name, Length

      - name: Status line chaining test
        shell: pwsh
        run: |
          $claude = Join-Path $env:USERPROFILE '.claude'
          New-Item -ItemType Directory -Force $claude | Out-Null
          $node = (Get-Command node).Source
          $js = Join-Path $env:RUNNER_TEMP '額度 測試\statusline.js'
          New-Item -ItemType Directory -Force (Split-Path $js) | Out-Null
          [IO.File]::WriteAllText($js, "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log('CUSTOM 額度 '+j.model.display_name)})")
          $cfg = @{ statusLine = @{ type = 'command'; command = "`"$node`" `"$js`""; padding = 1 } } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path $claude 'settings.json'), $cfg, [Text.UTF8Encoding]::new($false))
          Start-Process publish\IslandBar.exe -ArgumentList '--statusline-install' -Wait
          $out = @("== 加上之後", (Get-Content (Join-Path $claude 'settings.json') -Raw -Encoding utf8))
          $psi = [Diagnostics.ProcessStartInfo]::new((Resolve-Path publish\IslandBar.exe).Path, '--statusline --chain')
          $psi.UseShellExecute = $false; $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true
          $psi.StandardOutputEncoding = [Text.Encoding]::UTF8
          $p = [Diagnostics.Process]::Start($psi)
          $p.StandardInput.Write('{"model":{"display_name":"Opus"},"rate_limits":{"five_hour":{"used_percentage":42,"resets_at":1999999999},"seven_day":{"used_percentage":7}}}')
          $p.StandardInput.Close()
          $text = $p.StandardOutput.ReadToEnd(); $p.WaitForExit(15000) | Out-Null
          $out += "== 狀態列輸出：$text"
          $sl = Join-Path $env:APPDATA 'IslandBar\claude-statusline.json'
          $out += "== 額度檔：" + $(if (Test-Path $sl) { Get-Content $sl -Raw } else { '（沒有）' })
          Start-Process publish\IslandBar.exe -ArgumentList '--statusline-uninstall' -Wait
          $out += "== 拿掉之後", (Get-Content (Join-Path $claude 'settings.json') -Raw -Encoding utf8)
          New-Item -ItemType Directory -Force shots | Out-Null
          $out | Out-File -Encoding utf8 shots\statusline-test.txt
          $out

      - name: Assistant self-test
        if: ${{ inputs.assistant }}
        shell: pwsh
        timeout-minutes: 25
        run: |
          $shots = (Resolve-Path shots).Path
          $p = Start-Process -FilePath publish\IslandBar.exe -ArgumentList '--assistant-test', $shots -PassThru
          if (-not $p.WaitForExit(1200000)) { Stop-Process $p -Force; 'timeout' | Out-File shots\assistant-timeout.txt }
          Remove-Item shots\zh.wav -ErrorAction SilentlyContinue
          Get-Content shots\assistant-test.txt -ErrorAction SilentlyContinue

      - name: Push screenshots to ci-smoke branch
        shell: bash
        run: |
          cd shots
          git init -q -b ci-smoke
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "windows smoke ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-smoke
