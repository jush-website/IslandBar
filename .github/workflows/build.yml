name: Build

# 每次 push 到 main 都會編譯；
# 如果 version.txt 的版本號還沒有對應的 Release，就自動建立 Release（App 的自動更新會抓這裡）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          $publish = 'false'
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            gh release view "v$v" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $publish = 'true' }
          }
          $global:LASTEXITCODE = 0
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v publish=$publish"

      - name: Publish IslandBar.exe
        shell: pwsh
        run: |
          dotnet publish src/IslandBar/IslandBar.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=${{ steps.ver.outputs.version }} -o publish 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error |error NU|error MSB|warning NU' | Select-Object -First 40 |
              ForEach-Object { Write-Host ("::error::" + $_.Line.Trim()) }
            exit 1
          }

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet build installer/IslandBar.Installer.wixproj -c Release `
            -p:ProductVersion=${{ steps.ver.outputs.version }} `
            -p:PublishDir=${{ github.workspace }}\publish\ -o dist 2>&1 | Tee-Object -FilePath msi.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path msi.log -Pattern ': error |error WIX|error NU|error MSB' | Select-Object -First 40 |
              ForEach-Object { Write-Host ("::error::" + $_.Line.Trim()) }
            exit 1
          }

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\*.msi out\IslandBar-Setup-${{ steps.ver.outputs.version }}.msi
          Copy-Item publish\IslandBar.exe out\IslandBar-portable.exe
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: IslandBar-${{ steps.ver.outputs.version }}
          path: out/*

      - name: GitHub Release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: IslandBar v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG-latest.md
          make_latest: true
          files: out/*
