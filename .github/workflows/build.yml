name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart('v') } else { $v = "1.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish IslandBar.exe
        run: >
          dotnet publish src/IslandBar/IslandBar.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Build MSI
        run: >
          dotnet build installer/IslandBar.Installer.wixproj -c Release
          -p:ProductVersion=${{ steps.ver.outputs.version }}
          -p:PublishDir=${{ github.workspace }}\publish\
          -o dist

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\*.msi out\IslandBar-Setup-${{ steps.ver.outputs.version }}.msi
          Copy-Item publish\IslandBar.exe out\IslandBar-portable.exe
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: IslandBar-${{ steps.ver.outputs.version }}
          path: out/*

      - name: GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
