name: Linux smoke test

# 手動執行：在虛擬 X 伺服器上跑 Linux 版並截圖，截圖推到 ci-smoke 分支（只用來檢查畫面）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          dotnet publish src/IslandBar.Linux/IslandBar.Linux.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish

      - name: Install X server and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick fonts-noto-cjk lm-sensors > /dev/null

      - name: Fake NVIDIA GPU and PAIR cluster
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/nvidia-smi <<'SH'
          #!/bin/sh
          case "$*" in
            *query-gpu*) echo "0, NVIDIA GeForce RTX 4090, 67, 15468, 24564, 64, 45, 285.30, 450.00, 2520" ;;
            *query-compute-apps*) echo "4242, /usr/local/bin/ollama, 14200" ;;
          esac
          SH
          chmod +x /tmp/fakebin/nvidia-smi
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          D="$HOME/.config/Nvidia Corporation/Personal AI Router"
          mkdir -p "$D/cluster"
          echo '{"node_uuid":"aaaa-1"}' > "$D/cluster/identity.json"
          echo '[{"nodeUuid":"aaaa-1","id":"aaaa-1","name":"lab-pc-01","ipAddress":"10.0.0.5"},{"nodeUuid":"bbbb-2","id":"bbbb-2","name":"lab-pc-02","ipAddress":"127.0.0.2"},{"nodeUuid":"cccc-3","id":"cccc-3","name":"dgx-spark","ipAddress":"127.0.0.9"}]' > "$D/cluster/members.json"
          now=$(($(date +%s%3N)))
          echo "[{\"id\":\"w1\",\"originatedFrom\":\"bbbb-2\",\"model\":\"ggml-org/gemma-3-4b-it-GGUF:Q4_K_M\",\"engine\":\"llama.cpp\",\"state\":\"completed\",\"scheduledOn\":\"aaaa-1\",\"createdAt\":$((now-190000)),\"startedAt\":$((now-188000)),\"completedAt\":$((now-180000))}]" > "$D/workloads-history.json"
          cat > /tmp/fakepair.py <<'PY'
          import json, threading
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_GET(self):
                  port = self.server.server_address[1]
                  host = self.headers.get('Host', '').split(':')[0]
                  if port == 14318:
                      util, used = (72, 15.5) if host == '127.0.0.1' else (4, 2.1)
                      body = {"GPUs": [{"name": "NVIDIA GeForce RTX 4090", "utilization_percent": util,
                                        "vram_bytes": 24 * 2**30, "vram_used_bytes": int(used * 2**30)}]}
                  elif port == 11434 and self.path == '/v1/models':
                      body = {"data": [{"id": "gemma3:4b"}, {"id": "qwen3:8b"}, {"id": "gpt-oss:20b"}]}
                  elif port == 11435 and self.path == '/api/ps':
                      body = {"models": [{"name": "gemma3:4b", "size_vram": 5200000000}]}
                  else:
                      self.send_response(404); self.end_headers(); return
                  data = json.dumps(body).encode()
                  self.send_response(200); self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(data))); self.end_headers(); self.wfile.write(data)
          for p in (14318, 11434, 11435):
              threading.Thread(target=ThreadingHTTPServer(('0.0.0.0', p), H).serve_forever, daemon=True).start()
          threading.Event().wait()
          PY
          nohup python3 /tmp/fakepair.py > /tmp/fakepair.log 2>&1 &
          sleep 1
          curl -s http://127.0.0.2:14318/v1/node-info; echo

      - name: Screenshots
        run: |
          mkdir -p shots
          for mode in compact sys temp pair; do
            rm -rf ~/.config/IslandBar
            xvfb-run -a -s "-screen 0 1600x1000x24" bash -c "
              ./publish/islandbar --demo $mode > shots/$mode.out 2>&1 &
              sleep 10
              import -window root shots/$mode-full.png
              kill %1 || true
              sleep 1"
            convert shots/$mode-full.png -crop 800x760+400+0 +repage shots/$mode.png || true
            cp ~/.config/IslandBar/log.txt shots/$mode.log 2>/dev/null || true
          done
          ls /sys/class/hwmon/ > shots/hwmon.txt 2>&1 || true
          nvidia-smi > shots/nvidia.txt 2>&1 || true
          ls -la shots

      - name: Push screenshots to ci-smoke branch
        run: |
          cd shots
          rm -f *-full.png
          git init -q -b ci-smoke
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "smoke ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-smoke
